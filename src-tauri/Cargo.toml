[package]
name = "almanac"
version = "0.1.0"
description = "Calendario personal rápido y cifrado"
authors = ["UnratedNDU"]
edition = "2021"
license = "MIT"
repository = "https://github.com/UnratedNDU/almanac"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "almanac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
rrule = "0.14.0"
thiserror = "2.0.21"
getrandom = "0.4.3"
zeroize = { version = "1.9.0", features = ["derive"] }
data-encoding = "2.11.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v7"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
